name: E2E-Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.glb', 'CI-LOG.md', 'ci-screenshots/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    name: Playwright (headless Chromium, WebGL via SwiftShader)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhaengigkeiten installieren
        id: npm
        continue-on-error: true
        run: npm install --no-audit --no-fund > "$GITHUB_WORKSPACE/npm-install.log" 2>&1

      - name: Playwright Chromium installieren
        id: pw
        continue-on-error: true
        if: steps.npm.outcome == 'success'
        run: npx playwright install --with-deps chromium > "$GITHUB_WORKSPACE/pw-install.log" 2>&1

      - name: E2E-Tests ausfuehren
        id: tests
        continue-on-error: true
        if: steps.npm.outcome == 'success' && steps.pw.outcome == 'success'
        run: |
          set +e
          echo "=== Testlauf begonnen: $(date -u '+%Y-%m-%d %H:%M:%S') UTC ==="
          npx playwright test 2>&1 | tee "$GITHUB_WORKSPACE/test-output.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "=== Testlauf beendet: $(date -u '+%Y-%m-%d %H:%M:%S') UTC ==="

      - name: Test-Report und Screenshots als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            ci-screenshots/
            test-output.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Protokoll und Karten-Screenshots ins Repository committen
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "# E2E-Testlauf"
            echo
            echo "- Commit: ${GITHUB_SHA:0:7}"
            echo "- Lauf: ${GITHUB_RUN_NUMBER} (ID ${GITHUB_RUN_ID})"
            echo "- Zeit (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- npm install: ${{ steps.npm.outcome }}"
            echo "- Playwright-Installation: ${{ steps.pw.outcome }}"
            echo "- Testlauf: ${{ steps.tests.outcome }} (Exit-Code: ${{ steps.tests.outputs.exit || 'kein' }})"
            echo
            echo "## Ausgaben"
            for f in npm-install.log pw-install.log test-output.log; do
              echo
              echo "### $f"
              echo
              echo '```'
              if [ -f "$GITHUB_WORKSPACE/$f" ]; then tail -n 200 "$GITHUB_WORKSPACE/$f"; else echo "(nicht vorhanden)"; fi
              echo '```'
            done
            echo
            echo "## Karten-Screenshots"
            echo
            if [ -d "$GITHUB_WORKSPACE/ci-screenshots" ]; then
              for p in "$GITHUB_WORKSPACE"/ci-screenshots/*.png; do
                [ -f "$p" ] && echo "- [$(basename "$p")](ci-screenshots/$(basename "$p")) ($(stat -c%s "$p") Bytes)"
              done
            else
              echo "(keine Screenshots vorhanden)"
            fi
          } > CI-LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI-LOG.md
          if [ -d ci-screenshots ]; then git add ci-screenshots; fi
          ( git diff --cached --quiet || (git commit -m "CI: Protokoll und Karten-Screenshots Lauf #${GITHUB_RUN_NUMBER}" && git push) ) || echo "Protokoll-Push nicht moeglich"

      - name: Lauf bewerten
        if: always()
        run: |
          ok=0
          [ "${{ steps.npm.outcome }}" = "success" ] || { echo "npm install fehlgeschlagen"; ok=1; }
          [ "${{ steps.pw.outcome }}" = "success" ] || { echo "playwright install fehlgeschlagen"; ok=1; }
          [ "${{ steps.tests.outputs.exit || '1' }}" = "0" ] || { echo "Tests fehlgeschlagen oder nicht ausgefuehrt"; ok=1; }
          exit $ok
